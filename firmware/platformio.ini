; Active-Safety Helmet - integrated firmware
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32 @ 6.12.0        ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    electroniccats/MPU6050 @ 1.4.4
    h2zero/NimBLE-Arduino @ 2.4.0
    madhephaestus/ESP32Servo @ 3.0.9
